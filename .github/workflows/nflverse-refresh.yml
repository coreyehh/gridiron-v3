name: NFLverse historical data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '35 11 * * 2'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Download and audit historical data
        run: python scripts/ingest.py --seasons 2021 2022 2023 2024 2025 --output output
      - name: Evaluate chronological historical forecasting baselines
        run: python scripts/evaluate.py --features output/features.csv --output output/evaluation.json
      - name: Run eligibility-proxy unit tests
        run: python -m unittest -v test_eligibility
      - name: Evaluate position-specific prediction baselines
        run: python scripts/evaluate_eligible.py --features output/features.csv --output output/position_evaluation.json
      - name: Check PBP opportunity feature invariants
        run: python -m unittest -v test_opportunity
      - name: Evaluate RB opportunity model on same held-out players
        run: python scripts/opportunity.py --seasons 2021 2022 2023 2024 2025 --output output
      - uses: actions/upload-artifact@v4
        with:
          name: historical-features-and-audit
          path: |
            output/manifest.json
            output/features.csv
            output/evaluation.json
            output/position_evaluation.json
            output/opportunity_evaluation.json
            output/opportunity_features.csv
          retention-days: 30
      - name: Update published dataset manifest
        run: |
          mkdir -p docs/data
          cp output/manifest.json docs/data/manifest.json
          cp output/evaluation.json docs/data/evaluation.json
          cp output/position_evaluation.json docs/data/position_evaluation.json
          cp output/opportunity_evaluation.json docs/data/opportunity_evaluation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/manifest.json docs/data/evaluation.json docs/data/position_evaluation.json docs/data/opportunity_evaluation.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update validated NFLverse manifest'
            git push
          fi
