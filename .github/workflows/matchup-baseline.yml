name: GRIDIRON matchup baseline validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'matchup_engine/**'
      - 'scripts/run_matchup_baseline.py'
      - 'tests/test_matchup_engine.py'
      - '.github/workflows/matchup-baseline.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_matchup_engine.py
      - run: python -m scripts.run_matchup_baseline --through-season 2025
      - uses: actions/upload-artifact@v4
        with:
          name: matchup-baseline-results
          path: artifacts/matchup/
