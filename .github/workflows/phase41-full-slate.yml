name: GRIDIRON Phase 41 full slate encrypted quotes and readable dashboard
on:
  workflow_dispatch:
    inputs:
      collect_future_game_quotes:
        description: "OFF by default; ON charges Odds API credits for each remaining future event"
        type: boolean
        default: false
        required: true
      max_new_events:
        description: "Maximum additional priced event requests (0–13)"
        type: choice
        options:
          - '0'
          - '1'
          - '3'
          - '6'
          - '13'
        default: '0'
        required: true
      region:
        type: choice
        options: [us, us2, ca]
        default: us
        required: true
      previous_ledger_run_id:
        description: "Completed Phase40 encrypted ledger run ID"
        type: string
        default: '39061690969'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  phase41:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Phase41 regression safeguards and old code
        run: python -m unittest -v test_phase41_full_slate test_phase40_prospective_ledger test_phase39_secure_quote_evidence
      - name: Retrieve original encrypted historical HOU-JAX ledger
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.previous_ledger_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then echo "Invalid archive run ID"; exit 1; fi
          mkdir -p private_data/phase41
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" \
            --name phase40-ENCRYPTED-locked-and-settled-ledgers --dir private_data/phase41
          test -s private_data/phase41/locked_ledger.fernet
      - name: Build consolidated research board with optional future-only live FanDuel requests
        env:
          QUOTE_ARCHIVE_KEY: ${{ secrets.QUOTE_ARCHIVE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LIVE: ${{ inputs.collect_future_game_quotes }}
          CAP: ${{ inputs.max_new_events }}
          REGION: ${{ inputs.region }}
        run: |
          if [ "$LIVE" = "true" ]; then
            if [ "$CAP" = "0" ]; then echo "Live requested but cap 0; choose a nonzero max"; exit 1; fi
            python -m scripts.phase41_full_slate --live --max-events "$CAP" --region "$REGION" \
              --existing-ledger private_data/phase41/locked_ledger.fernet
          else
            python -m scripts.phase41_full_slate --max-events 0 \
              --existing-ledger private_data/phase41/locked_ledger.fernet
          fi
      - name: Public readable projections only (no bookmaker lines or prices)
        uses: actions/upload-artifact@v4
        with:
          name: phase41-READABLE-public-research-board
          path: |
            output/phase41/GRIDIRON_Week6_Public_Research_Dashboard.html
            output/phase41/public_summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Private full slate markets in one Fernet archive
        uses: actions/upload-artifact@v4
        with:
          name: phase41-ENCRYPTED-all-captured-fanduel-markets
          path: output/phase41/locked_full_slate.fernet
          retention-days: 30
          if-no-files-found: error
