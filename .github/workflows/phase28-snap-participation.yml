name: GRIDIRON Phase 28 real offensive snap participation
on:
  workflow_dispatch:
    inputs:
      run_real_data:
        description: "Check PFR offensive snap data via nflverse and evaluate challenger"
        type: boolean
        default: true
        required: true
      team_a:
        description: "Optional team code (both blank: next game)"
        type: string
        default: ''
      team_b:
        description: "Optional opponent code"
        type: string
        default: ''
      week:
        description: "Week or 0 for next future matchup"
        type: string
        default: '0'
permissions:
  contents: read
jobs:
  phase28:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify participation crosswalk and previous phase protections
        run: python -m unittest -v test_phase28_snap_participation test_phase27_matchup_context test_phase26_matchup_board test_phase25_market_gate test_phase24_calibration test_phase23_role_model test_phase22_script_intervals test_phase21_walkforward test_phase20_opportunity
      - name: Verify CLI
        run: python -m scripts.phase28_snap_participation --help >/dev/null
      - name: Evaluate real 2026 PFR snaps and matchup forecasts
        if: ${{ inputs.run_real_data }}
        env:
          TEAM_A: ${{ inputs.team_a }}
          TEAM_B: ${{ inputs.team_b }}
          WEEK: ${{ inputs.week }}
        run: |
          python -m scripts.phase28_snap_participation --team-a "$TEAM_A" --team-b "$TEAM_B" --week "$WEEK"
      - name: Publish readable source-tracked research
        if: ${{ inputs.run_real_data }}
        uses: actions/upload-artifact@v4
        with:
          name: phase28-snap-participation-audit
          path: output/phase28_snap_participation.json
          retention-days: 30
          if-no-files-found: error
