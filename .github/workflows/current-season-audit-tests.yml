name: GRIDIRON current-season audit unit tests
on:
  pull_request:
    paths:
      - 'scripts/audit_current_season.py'
      - 'tests/test_current_season_audit.py'
      - '.github/workflows/current-season-audit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_current_season_audit.py' -v
