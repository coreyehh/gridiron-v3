name: GRIDIRON current-season audit unit tests
on:
  pull_request:
    paths:
      - 'scripts/audit_current_season.py'
      - 'scripts/audit_player_identity.py'
      - 'scripts/ingest.py'
      - 'scripts/pregame_availability_gate.py'
      - 'tests/test_pregame_availability_gate.py'
      - 'scripts/availability_evidence_adapter.py'
      - 'tests/test_availability_evidence_adapter.py'
      - 'scripts/availability_source_verifier.py'
      - 'tests/test_availability_source_verifier.py'
      - 'scripts/wager_approval_gate.py'
      - 'tests/test_wager_approval_gate.py'
      - 'scripts/market_price_math.py'
      - 'tests/test_market_price_math.py'
      - 'scripts/probability_calibration_audit.py'
      - 'tests/test_probability_calibration_audit.py'
      - 'tests/test_current_season_audit.py'
      - '.github/workflows/current-season-audit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*audit.py' -v && python -m unittest discover -s tests -p 'test_pregame_availability_gate.py' -v && python -m unittest discover -s tests -p 'test_availability_evidence_adapter.py' -v && python -m unittest discover -s tests -p 'test_availability_source_verifier.py' -v && python -m unittest discover -s tests -p 'test_wager_approval_gate.py' -v && python -m unittest discover -s tests -p 'test_market_price_math.py' -v && python -m unittest discover -s tests -p 'test_probability_calibration_audit.py' -v
  integration-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Download 2026 NFL player-week data
        run: python scripts/ingest.py --seasons 2026 --output output/current_2026
      - name: Audit observed 2026 season coverage
        run: python scripts/audit_current_season.py --manifest output/current_2026/manifest.json --features output/current_2026/features.csv --season 2026 --min-week 6 --max-age-days 14
      - name: Audit source player-to-team identity
        run: python scripts/audit_player_identity.py --source output/current_2026/stats_player_week_2026.parquet --season 2026 --output output/current_2026/identity_audit.json
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-season-2026-pr-validation
          path: output/current_2026/
          retention-days: 14
          if-no-files-found: warn
