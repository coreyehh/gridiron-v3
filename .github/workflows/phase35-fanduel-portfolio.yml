name: GRIDIRON Phase 35 FanDuel singles parlays and unit portfolio
on:
  workflow_dispatch:
    inputs:
      bankroll:
        description: "Bankroll in dollars, e.g. 1000"
        type: string
        required: true
        default: '1000'
      unit_percent:
        description: "One unit as percent of bankroll (maximum 2%)"
        type: choice
        options: ['0.5', '1', '2']
        required: true
        default: '1'
      request_live_fanduel:
        description: "OFF by default. Opt in to ONE live FanDuel event (uses Odds API credits)"
        type: boolean
        required: true
        default: false
      region:
        description: "Odds API FanDuel coverage region"
        type: choice
        options: [us, us2, ca]
        default: us
      event_id:
        description: "Optional Odds API event ID, blank uses earliest matching Week6 future event"
        type: string
        default: ''
permissions:
  contents: read
jobs:
  phase35:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test FanDuel price matching parlay correlation gates units and older phases
        run: python -m unittest -v test_phase35_fanduel_portfolio test_phase34_decision_dashboard test_phase33_probability_evidence test_phase32_market_matching test_phase31_accountability test_phase30_model_leaderboard test_phase29_route_readiness test_phase28_snap_participation test_phase27_matchup_context test_phase26_matchup_board test_phase25_market_gate test_phase24_calibration test_phase23_role_model test_phase22_script_intervals test_phase21_walkforward test_phase20_opportunity
      - name: No-credit portfolio and accountability baseline
        if: ${{ !inputs.request_live_fanduel }}
        env:
          BANKROLL: ${{ inputs.bankroll }}
          UNIT_PCT: ${{ inputs.unit_percent }}
        run: python -m scripts.phase35_fanduel_portfolio --bankroll "$BANKROLL" --unit-percent "$UNIT_PCT"
      - name: Explicitly opted-in one-event real FanDuel integrity audit
        if: ${{ inputs.request_live_fanduel }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BANKROLL: ${{ inputs.bankroll }}
          UNIT_PCT: ${{ inputs.unit_percent }}
          REGION: ${{ inputs.region }}
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          python -m scripts.phase35_fanduel_portfolio --bankroll "$BANKROLL" --unit-percent "$UNIT_PCT" --request-live-fanduel --region "$REGION" --event-id "$EVENT_ID"
      - name: Upload public-safe bankroll policy and zero-bet accountability
        uses: actions/upload-artifact@v4
        with:
          name: phase35-fanduel-portfolio-policy-and-ledger
          path: output/phase35/
          retention-days: 45
          if-no-files-found: error
