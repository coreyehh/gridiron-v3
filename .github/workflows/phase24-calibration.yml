name: GRIDIRON Phase 24 participation and calibration audit
on:
  workflow_dispatch:
    inputs:
      run_real_data:
        description: "Evaluate prequential statistical threshold calibration (zero sportsbook credits)"
        type: boolean
        default: true
        required: true
      first_week:
        description: "First test week (minimum 4)"
        type: string
        default: '4'
        required: true
      last_week:
        description: "Last test week (only fully completed weeks)"
        type: string
        default: '18'
        required: true
permissions:
  contents: read
jobs:
  phase24:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify Phase 20 through 24 safeguards
        run: python -m unittest -v test_phase24_calibration test_phase23_role_model test_phase22_script_intervals test_phase21_walkforward test_phase20_opportunity
      - name: Check CLI
        run: python -m scripts.phase24_participation_calibration --help >/dev/null
      - name: Run genuine player-data threshold calibration evaluation
        if: ${{ inputs.run_real_data }}
        env:
          FIRST_WEEK: ${{ inputs.first_week }}
          LAST_WEEK: ${{ inputs.last_week }}
        run: |
          python -m scripts.phase24_participation_calibration --first-week "$FIRST_WEEK" --last-week "$LAST_WEEK"
      - name: Publish public aggregate report
        if: ${{ inputs.run_real_data }}
        uses: actions/upload-artifact@v4
        with:
          name: phase24-calibration-audit
          path: output/phase24_audit.json
          retention-days: 30
          if-no-files-found: error
